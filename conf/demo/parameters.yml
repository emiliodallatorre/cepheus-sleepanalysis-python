study:
  timezone: Europe/Rome
  cutoff: "20:00"
  history_days: 180
  refresh_days: 7
  demo: true
  demo_now: "2026-10-07T20:15:00+02:00"
  data_root: ${globals:data_root}
  screentime_executable: screentime
  screentime_revision: synthetic
  screentime_config: "~/.config/screentime/config.toml"
  garmin_tokenstore: "~/.config/cepheus/garmin"
  garmin_region: global
  device_ids: ["demo-mac", "demo-phone", "demo-tablet"]
  device_platforms: {demo-mac: mac, demo-phone: iphone, demo-tablet: ipad}
  confirmed_coverage:
    - {device_id: demo-mac, start: "2026-04-01", end: "2026-10-07"}
    - {device_id: demo-phone, start: "2026-04-01", end: "2026-10-07"}
    - {device_id: demo-tablet, start: "2026-04-01", end: "2026-10-07"}
  max_collection_age_minutes: 45
  retry_attempts: 3
  request_pause_seconds: 0.5
  min_paired_nights: 60
  initial_training_nights: 40
  min_backtest_nights: 20
  ridge_alpha: 10.0
